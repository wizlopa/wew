
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>B6 - Simple 3D Car WebAR</title>

  <!-- A-Frame 3D framework -->
  <script src="https://aframe.io/releases/1.6.0/aframe.min.js"></script>

  <!-- AR.js marker-based WebAR -->
  <script src="https://cdn.jsdelivr.net/gh/AR-js-org/AR.js@3.4.7/aframe/build/aframe-ar.js"></script>

  <style>
    body {
      margin: 0;
      font-family: Arial, sans-serif;
    }

    .info {
      position: fixed;
      top: 12px;
      left: 0;
      right: 0;
      text-align: center;
      z-index: 10;
      pointer-events: none;
    }

    .info h2 {
      display: inline-block;
      background: rgba(0, 0, 0, 0.75);
      color: white;
      padding: 10px 16px;
      border-radius: 10px;
      font-size: 18px;
    }
  </style>
</head>

<body>
  <div class="info">
    <h2>B6: Simple 3D Car WebAR</h2>
  </div>

  <a-scene
    embedded
    arjs="sourceType: webcam; debugUIEnabled: false;"
    vr-mode-ui="enabled: false"
    renderer="antialias: true; colorManagement: true;">

    <a-assets>
      <a-mixin id="tyre"
        geometry="primitive: cylinder; radius: 0.22; height: 0.16; segmentsRadial: 24"
        material="color: #202020; roughness: 0.9"
        rotation="90 0 0">
      </a-mixin>
    </a-assets>

    <!-- Hiro marker -->
    <a-marker preset="hiro">

      <!-- Entire car model -->
      <a-entity id="car" position="0 0 0" scale="0.5 0.5 0.5">

        <!-- Main body -->
        <a-box
          position="0 0.65 0"
          width="3.6"
          height="0.65"
          depth="1.5"
          material="color: #d71920; roughness: 0.35">
        </a-box>

        <!-- Cabin -->
        <a-box
          position="-0.25 1.3 0"
          width="1.8"
          height="0.7"
          depth="1.2"
          material="color: #d71920; roughness: 0.35">
        </a-box>

        <!-- Side windows -->
        <a-box
          position="-0.25 1.35 0.606"
          width="1.4"
          height="0.42"
          depth="0.025"
          material="color: #66d9ff; metalness: 0.2; roughness: 0.2">
        </a-box>

        <a-box
          position="-0.25 1.35 -0.606"
          width="1.4"
          height="0.42"
          depth="0.025"
          material="color: #66d9ff; metalness: 0.2; roughness: 0.2">
        </a-box>

        <!-- Windshields -->
        <a-box
          position="0.68 1.32 0"
          width="0.04"
          height="0.45"
          depth="1.0"
          material="color: #66d9ff">
        </a-box>

        <a-box
          position="-1.15 1.32 0"
          width="0.04"
          height="0.45"
          depth="1.0"
          material="color: #66d9ff">
        </a-box>

        <!-- Four wheels -->
        <a-entity mixin="tyre" position="1.1 0.38 0.78"></a-entity>
        <a-entity mixin="tyre" position="-1.1 0.38 0.78"></a-entity>
        <a-entity mixin="tyre" position="1.1 0.38 -0.78"></a-entity>
        <a-entity mixin="tyre" position="-1.1 0.38 -0.78"></a-entity>

        <!-- Wheel hubs -->
        <a-cylinder position="1.1 0.38 0.87"
          radius="0.11" height="0.025" rotation="90 0 0"
          material="color: silver; metalness: 0.8"></a-cylinder>
        <a-cylinder position="-1.1 0.38 0.87"
          radius="0.11" height="0.025" rotation="90 0 0"
          material="color: silver; metalness: 0.8"></a-cylinder>
        <a-cylinder position="1.1 0.38 -0.87"
          radius="0.11" height="0.025" rotation="90 0 0"
          material="color: silver; metalness: 0.8"></a-cylinder>
        <a-cylinder position="-1.1 0.38 -0.87"
          radius="0.11" height="0.025" rotation="90 0 0"
          material="color: silver; metalness: 0.8"></a-cylinder>

        <!-- Front headlights: car front faces +X -->
        <a-box position="1.82 0.72 0.48"
          width="0.06" height="0.18" depth="0.28"
          material="color: #fff2a0; emissive: #665522"></a-box>
        <a-box position="1.82 0.72 -0.48"
          width="0.06" height="0.18" depth="0.28"
          material="color: #fff2a0; emissive: #665522"></a-box>

        <!-- Rear lights -->
        <a-box position="-1.82 0.72 0.48"
          width="0.06" height="0.16" depth="0.25"
          material="color: #ff2020"></a-box>
        <a-box position="-1.82 0.72 -0.48"
          width="0.06" height="0.16" depth="0.25"
          material="color: #ff2020"></a-box>

        <!-- Bumpers -->
        <a-box position="1.86 0.48 0"
          width="0.12" height="0.13" depth="1.35"
          material="color: #333333"></a-box>
        <a-box position="-1.86 0.48 0"
          width="0.12" height="0.13" depth="1.35"
          material="color: #333333"></a-box>

      </a-entity>
    </a-marker>

    <a-entity camera></a-entity>
  </a-scene>
</body>
</html>
